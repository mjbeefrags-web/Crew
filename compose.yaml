name: crewww

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crewww}
      POSTGRES_USER: ${POSTGRES_USER:-crewww}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me-123456}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=${POSTGRES_SLOW_QUERY_MS:-250}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    # Loopback-only port for psql/pgAdmin/DBeaver on the host. 5433 avoids a
    # clash with a locally installed PostgreSQL that already owns 5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-2}
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-320m}
    cpus: ${REDIS_CPUS:-1}
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    networks: [internal]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &api_environment
      APP_ENV: ${APP_ENV:-docker}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-crewww}:${POSTGRES_PASSWORD:-local-only-change-me-123456}@db:5432/${POSTGRES_DB:-crewww}}
      # Neon direct URL. Empty locally; used only by Alembic migrations.
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-this-before-any-shared-environment-123456}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      UPLOAD_DIR: /app/uploads
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      APP_NAME: ${APP_NAME:-Crewww API}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      ENABLE_METRICS: ${ENABLE_METRICS:-0}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      # Local convenience defaults. Staging/production env files set these
      # empty, and APP_ENV=production rejects a non-empty bootstrap password.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL-admin@crewww.example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD-CrewwwOwner!2026}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    init: true
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    cpus: ${MIGRATE_CPUS:-1}
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    networks: [internal]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *api_environment
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPUS:-1.5}
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DATA_MODE: api
        VITE_API_BASE_URL: ""
        VITE_INITIAL_ROUTE: ${VITE_INITIAL_ROUTE:-/}
        VITE_FEATURE_RECENTLY_VIEWED: ${VITE_FEATURE_RECENTLY_VIEWED:-true}
        VITE_FEATURE_COMMAND_PALETTE: ${VITE_FEATURE_COMMAND_PALETTE:-true}
        VITE_FEATURE_AMBIENT_SOUND: ${VITE_FEATURE_AMBIENT_SOUND:-true}
        VITE_FEATURE_WORLD_WALK: ${VITE_FEATURE_WORLD_WALK:-true}
    ports:
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: ${WEB_CPUS:-1}
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  internal:
    driver: bridge
