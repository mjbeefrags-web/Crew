name: crewww

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crewww}
      POSTGRES_USER: ${POSTGRES_USER:-crewww}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me-123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &api_environment
      APP_ENV: docker
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crewww}:${POSTGRES_PASSWORD:-local-only-change-me-123456}@db:5432/${POSTGRES_DB:-crewww}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-this-before-any-shared-environment-123456}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      APP_NAME: ${APP_NAME:-Crewww API}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *api_environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DATA_MODE: api
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge

