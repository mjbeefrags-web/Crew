[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "crewww-api"
version = "0.1.0"
description = "Crewww storefront API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "SQLAlchemy[asyncio]==2.1.9",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "redis==8.1.0",
  "PyJWT==2.15.1",
  "pwdlib[argon2]==0.4.2",
  "email-validator==2.4.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "aiosqlite==0.22.1",
  "hypothesis==6.152.2",
  "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
